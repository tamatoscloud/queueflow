# Local development orchestration. The `backend` service is commented out
# until backend/Dockerfile exists (see backend/README.md) — Postgres and
# Redis are already usable today for early backend prototyping.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
      POSTGRES_DB: queueflow_dev
    ports:
      - "5432:5432"
    volumes:
      - queueflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: ../docker/backend/Dockerfile
  #   env_file:
  #     - ../backend/.env.development
  #   depends_on:
  #     - postgres
  #     - redis
  #   ports:
  #     - "3000:3000"

volumes:
  queueflow_postgres_data:
