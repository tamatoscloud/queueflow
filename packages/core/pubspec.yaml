name: queueflow_core
description: >-
  Cross-cutting application core: strongly-typed environment/flavor
  configuration, Result/Failure types, and logging contracts. Pure Dart —
  no Flutter dependency — so it can eventually be reused by a Dart backend.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  freezed_annotation: ^2.4.4
  meta: ^1.15.0
  queueflow_utils:
    path: ../utils
  riverpod: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  test: ^1.25.8
