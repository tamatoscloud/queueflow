name: queueflow_models
description: >-
  Shared, framework-agnostic data contracts (Freezed + json_serializable)
  reused across every QueueFlow client and, eventually, the backend.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  queueflow_core:
    path: ../core

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  test: ^1.25.8
