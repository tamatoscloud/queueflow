name: queueflow_network
description: >-
  Dio-based HTTP client factory, interceptors, and typed exception mapping.
  Pure Dart — Dio does not require the Flutter SDK.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  queueflow_core:
    path: ../core
  queueflow_models:
    path: ../models
  queueflow_utils:
    path: ../utils
  riverpod: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  test: ^1.25.8
