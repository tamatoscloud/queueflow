name: staff_app
description: QueueFlow staff console — Toast POS speed for receptionists.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  queueflow_core:
    path: ../../packages/core
  queueflow_models:
    path: ../../packages/models
  queueflow_network:
    path: ../../packages/network
  queueflow_services:
    path: ../../packages/services
  queueflow_shared:
    path: ../../packages/shared
  queueflow_theme:
    path: ../../packages/theme
  queueflow_ui:
    path: ../../packages/ui
  queueflow_utils:
    path: ../../packages/utils
  queueflow_widgets:
    path: ../../packages/widgets
  riverpod_annotation: ^2.6.1
  shimmer: ^3.0.0
  socket_io_client: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.staging
    - .env.production
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
