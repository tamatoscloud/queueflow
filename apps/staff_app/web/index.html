<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quyk staff console for restaurant queues">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quyk Staff">
  <meta name="theme-color" content="#003E31">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="brand/quyk-logo.png"/>
  <title>Quyk Staff</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #003E31; }
    #qf-boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      background: #003E31; color: #E7FF27;
    }
    #qf-boot img {
      width: min(220px, 56vw); height: auto; margin-bottom: 20px;
    }
    #qf-boot p { margin: 0; color: rgba(231, 255, 39, 0.72); font-size: 14px; }
  </style>
</head>
<body>
  <div id="qf-boot">
    <img src="brand/quyk-logo.png" alt="Quyk" />
    <p>Loading restaurant console…</p>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('qf-boot');
      if (el) el.remove();
    });
  </script>
</body>
</html>
