<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quyk restaurant now-serving display">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quyk TV">
  <meta name="theme-color" content="#003D32">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Quyk TV</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #003D32; }
    #qf-boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Hanken Grotesk', Inter, Segoe UI, system-ui, sans-serif;
      background: #003D32; color: #FFFFFF;
    }
    #qf-boot .mark {
      width: 56px; height: 56px; border-radius: 17px;
      background: #E4FF2C url('brand/quyk-logo.png') center / 62% no-repeat;
      margin-bottom: 16px;
    }
    #qf-boot h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    #qf-boot p { margin: 0; color: #B8CCC4; font-size: 14px; }
  </style>
</head>
<body>
  <div id="qf-boot">
    <div class="mark"></div>
    <h1>Quyk TV</h1>
    <p>Loading now-serving display…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('qf-boot');
      if (el) el.remove();
    });
  </script>
</body>
</html>
