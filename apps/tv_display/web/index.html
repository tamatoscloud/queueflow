<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QueueFlow restaurant now-serving display">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QueueFlow TV">
  <meta name="theme-color" content="#0B0D12">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>QueueFlow TV</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #003E31; }
    #qf-boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      background: #003E31; color: #F1F5F9;
    }
    #qf-boot .mark {
      width: 48px; height: 48px; border-radius: 14px;
      background: #E7FF27;
      margin-bottom: 16px;
    }
    #qf-boot h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    #qf-boot p { margin: 0; color: #94A3B8; font-size: 14px; }
  </style>
</head>
<body>
  <div id="qf-boot">
    <div class="mark"></div>
    <h1>QueueFlow TV</h1>
    <p>Loading now-serving display…</p>
  </div>
  <script>
    // Clear stale PWA workers from older deploys so users never get a blank cached shell.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('qf-boot');
      if (el) el.remove();
    });
  </script>
</body>
</html>
