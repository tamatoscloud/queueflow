name: tv_display
description: QueueFlow TV Display — large-screen queue board for branches.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  queueflow_core:
    path: ../../packages/core
  queueflow_models:
    path: ../../packages/models
  queueflow_network:
    path: ../../packages/network
  queueflow_services:
    path: ../../packages/services
  queueflow_shared:
    path: ../../packages/shared
  queueflow_theme:
    path: ../../packages/theme
  queueflow_ui:
    path: ../../packages/ui
  queueflow_utils:
    path: ../../packages/utils
  queueflow_widgets:
    path: ../../packages/widgets
  socket_io_client: ^3.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.staging
    - .env.production
