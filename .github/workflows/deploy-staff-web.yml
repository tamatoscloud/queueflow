name: Deploy staff web

# Vercel's git integration skips Flutter apps ("Ignored Build Step"), so the
# staff app is built here and uploaded with the Vercel CLI.
#
# Required repository secrets:
#   VERCEL_TOKEN       – Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID      – Queueflow team id
#   VERCEL_PROJECT_ID  – queueflow-staff project id
# Optional repository variables (Settings → Variables) override the defaults:
#   STAFF_API_BASE_URL, STAFF_WS_BASE_URL, STAFF_CUSTOMER_PORTAL_URL
on:
  push:
    branches: [main]
    paths:
      - "apps/staff_app/**"
      - "packages/**"
      - "scripts/patch-flutter-web-loader.mjs"
      - ".github/workflows/deploy-staff-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staff-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set; skipping staff deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Bootstrap workspace
        if: steps.secrets.outputs.ready == 'true'
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Generate code
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          melos exec -c 1 --scope="queueflow_core" --scope="queueflow_models" --scope="queueflow_network" -- "dart run build_runner build --delete-conflicting-outputs"
          cd apps/staff_app
          dart run build_runner build --delete-conflicting-outputs \
            --build-filter="package:staff_app/features/auth/data/models/auth_user.dart" \
            --build-filter="package:staff_app/features/auth/data/models/auth_user.freezed.dart" \
            --build-filter="package:staff_app/features/auth/data/models/auth_user.g.dart"

      - name: Write env files
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/staff_app
        env:
          API_BASE_URL: ${{ vars.STAFF_API_BASE_URL || 'https://queueflow-backend-production.up.railway.app/api/v1' }}
          WS_BASE_URL: ${{ vars.STAFF_WS_BASE_URL || 'https://queueflow-backend-production.up.railway.app' }}
          CUSTOMER_PORTAL_URL: ${{ vars.STAFF_CUSTOMER_PORTAL_URL || 'https://queueflow-six-beta.vercel.app' }}
        run: |
          set -euo pipefail
          cp .env.dev.example .env.dev
          cp .env.staging.example .env.staging
          cat > .env.production <<ENV
          APP_NAME=Quyk Staff
          API_BASE_URL=$API_BASE_URL
          WS_BASE_URL=$WS_BASE_URL
          ENABLE_LOGGING=false
          API_TIMEOUT_SECONDS=15
          SENTRY_DSN=
          FIREBASE_PROJECT_ID=queueflow-prod
          CUSTOMER_PORTAL_URL=$CUSTOMER_PORTAL_URL
          ENV
          sed -i 's/^ *//' .env.production
          cat .env.production

      - name: Build web
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/staff_app
        run: |
          flutter build web --release -t lib/main_production.dart
          node ../../scripts/patch-flutter-web-loader.mjs build/web

      - name: Deploy to Vercel (production)
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/staff_app/build/web
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Staff app deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
