name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimal env for Prisma generate, typecheck, and unit tests (no real DB required).
  DATABASE_URL: postgresql://ci:ci@localhost:5432/queueflow_ci?schema=public
  JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
  REFRESH_TOKEN_SECRET: ci-refresh-secret-minimum-32-chars
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
  SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
  APP_ENV: development
  NOTIFICATION_USE_MOCK: "true"
  NOTIFICATION_QUEUE_ENABLED: "false"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  flutter:
    name: Flutter — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [business_app, staff_app, admin_panel, tv_display, marketing_website]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Generate code
        run: |
          set -euo pipefail
          # Full `melos run gen` hangs: unfiltered app build_runner compiles
          # native plugin build hooks (mobile_scanner / jni).
          melos exec -c 1 --scope="queueflow_core" --scope="queueflow_models" --scope="queueflow_network" -- "dart run build_runner build --delete-conflicting-outputs"
          if [ "${{ matrix.app }}" = "business_app" ] || [ "${{ matrix.app }}" = "staff_app" ]; then
            # Package-path filters are required; a bare lib/** glob writes 0 outputs.
            (cd "apps/${{ matrix.app }}" && dart run build_runner build --delete-conflicting-outputs \
              --build-filter="package:${{ matrix.app }}/features/auth/data/models/auth_user.dart" \
              --build-filter="package:${{ matrix.app }}/features/auth/data/models/auth_user.freezed.dart" \
              --build-filter="package:${{ matrix.app }}/features/auth/data/models/auth_user.g.dart")
            test -f "apps/${{ matrix.app }}/lib/features/auth/data/models/auth_user.freezed.dart"
            test -f "apps/${{ matrix.app }}/lib/features/auth/data/models/auth_user.g.dart"
          fi

      - name: Prepare env assets for analyzer
        run: |
          set -euo pipefail
          for app in business_app staff_app admin_panel tv_display marketing_website; do
            for env in dev staging production; do
              cp "apps/$app/.env.$env.example" "apps/$app/.env.$env"
            done
          done

      - name: Analyze
        run: flutter analyze --fatal-infos
        working-directory: apps/${{ matrix.app }}
        timeout-minutes: 10

      - name: Test
        run: flutter test
        working-directory: apps/${{ matrix.app }}
        timeout-minutes: 15

      - name: Build web
        run: flutter build web --release -t lib/main_production.dart
        working-directory: apps/${{ matrix.app }}
        timeout-minutes: 15

  customer-portal:
    name: Customer Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/customer-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E Browse Menu (prod demo API)
        run: npx playwright test e2e/browse-menu.spec.ts
        env:
          BASE_URL: https://queueflow-six-beta.vercel.app
          API_BASE_URL: https://queueflow-backend-production.up.railway.app/api/v1
          DINE_IN_QUEUE_ID: 5354156e-0e46-41a1-ab49-8c6dd9ac80f7
          TAKEAWAY_QUEUE_ID: 763167b4-7222-4970-ad13-c3cd34811feb
          DRIVE_IN_QUEUE_ID: 94f4d0c7-d458-431f-b27c-6995c223ffde

      - name: Production build
        # Retry: next/font Google fetch occasionally fails in Actions.
        run: |
          npm run build || (sleep 5 && npm run build) || (sleep 10 && npm run build)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_WS_BASE_URL: https://api.example.com
